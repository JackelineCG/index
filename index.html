<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#EEF1F6; --surface:#FFFFFF; --surface2:#F2F4F8; --ink:#101A2E; --ink2:#3C4A63; --line:#C7CEDC;
  --rio:#16294F; --rio-t:#2F5590; --hd:#0B1C3F; --mango:#D4A332; --mango-d:#8A6A1E; --aji:#B3352A; --hoja:#146B36; --uva:#5B3FA0; --azul:#2F5590;
  --btn-text:#12213F; --focus:#2F5590;
  --map:#EFE1BE; --hill:#CDA467; --dry:#A8804C; --water:#4E93A0; --bed:#D9C293; --tree:#7C8F52; --trunk:#7A4A2E; --cactus:#6E8A4F; --ceiba:#8A9A5E; --soil:#B5622E;
  --lw:#C9B892; --lr:#A08A5E; --halo:#D4A33255;
  --on-ok:#FFFFFF; --ok:#1B6E3F; --ok-bg:#E1F3E8; --no:#A82E1B; --no-bg:#FCE8E3; --warn:#8A5600; --warn-bg:#FFF0D2;
  --shadow:0 1px 0 rgba(16,39,43,.06),0 10px 26px -14px rgba(16,39,43,.32);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A1224; --surface:#101B33; --surface2:#0D1830; --ink:#EAEFF9; --ink2:#AEB9D0; --line:#2B3B5C;
    --rio:#3F6FA8; --rio-t:#7FA8DE; --hd:#0A1730; --mango:#E8BE5C; --mango-d:#E8BE5C; --aji:#E06A5A; --hoja:#3FA35C; --uva:#8B6FD4; --azul:#5B8FD0;
    --focus:#8ACBFF;
    --map:#3A2E1C; --hill:#6B5330; --dry:#8A6B42; --water:#3F7C89; --bed:#4A3B24; --tree:#5C6E3E; --trunk:#4A3222; --cactus:#5C7048; --ceiba:#6E7A48; --soil:#7A4222;
    --lw:#3B5459; --lr:#2A3F43; --halo:#F5B03D44;
    --on-ok:#06261A; --ok:#6EDC9A; --ok-bg:#12382A; --no:#FF9482; --no-bg:#3A1B16; --warn:#F5B03D; --warn-bg:#3A2D0F;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 26px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A1224; --surface:#101B33; --surface2:#0D1830; --ink:#EAEFF9; --ink2:#AEB9D0; --line:#2B3B5C;
  --rio:#3F6FA8; --rio-t:#7FA8DE; --hd:#0A1730; --mango:#E8BE5C; --mango-d:#E8BE5C; --aji:#E06A5A; --hoja:#3FA35C; --uva:#8B6FD4; --azul:#5B8FD0;
  --focus:#8ACBFF;
  --map:#3A2E1C; --hill:#6B5330; --dry:#8A6B42; --water:#3F7C89; --bed:#4A3B24; --tree:#5C6E3E; --trunk:#4A3222; --cactus:#5C7048; --ceiba:#6E7A48; --soil:#7A4222;
  --lw:#3B5459; --lr:#2A3F43; --halo:#F5B03D44;
  --on-ok:#06261A; --ok:#6EDC9A; --ok-bg:#12382A; --no:#FF9482; --no-bg:#3A1B16; --warn:#F5B03D; --warn-bg:#3A2D0F;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 26px -14px rgba(0,0,0,.6);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:radial-gradient(1100px 620px at 88% -8%,color-mix(in srgb,var(--mango) 14%,transparent),transparent 60%),radial-gradient(900px 500px at -10% 12%,color-mix(in srgb,var(--rio) 12%,transparent),transparent 55%),var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.55}
@media (prefers-reduced-motion: no-preference){.wrap{animation:screenIn .38s cubic-bezier(.2,.7,.2,1) both}}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
h1,h2,h3{font-family:"Bricolage Grotesque","Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.12;letter-spacing:-.01em;margin:0 0 .5em}
h1{font-size:clamp(1.9rem,5.2vw,3rem);font-weight:800}
h2{font-size:1.4rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0 0 .8em}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--mango);color:var(--btn-text);padding:10px 16px;border-radius:10px;z-index:100;font-weight:700}
.skip:focus{top:8px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.ic{width:1.25em;height:1.25em;flex:none;vertical-align:-.22em}
.ic.big{width:2.4rem;height:2.4rem;color:var(--mango-d)}

/* Encabezado */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:linear-gradient(120deg,var(--hd),var(--rio-t) 160%);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 16px;min-height:56px;box-shadow:0 6px 18px -10px rgba(0,0,0,.45)}
.brand{display:flex;align-items:center;gap:10px;font-family:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;font-weight:800;font-size:.95rem;line-height:1.15}
.brand img{width:38px;height:38px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.65)}
.brand .ic{color:#E8C878}
.brand .bt{display:flex;flex-direction:column}
.brand .bt small{font-weight:600;font-size:.72rem;opacity:.85;letter-spacing:.02em}
.river{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:.9rem}
.stone{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.6)}
.stone.on{background:var(--mango);border-color:var(--mango)}
.tbtn{background:transparent;border:2px solid rgba(255,255,255,.45);color:#fff;border-radius:12px;min-width:44px;min-height:44px;cursor:pointer;display:grid;place-items:center}

.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 56px}
.lead{font-size:1.1rem;max-width:62ch;color:var(--ink2)}
.small{font-size:.9rem;color:var(--ink2)}

/* Botones */
.btn{font:inherit;font-weight:700;min-height:48px;padding:10px 22px;border-radius:14px;border:2px solid var(--mango);background:linear-gradient(160deg,color-mix(in srgb,var(--mango) 100%,white 12%),var(--mango-d));color:var(--btn-text);cursor:pointer;box-shadow:0 6px 16px -8px color-mix(in srgb,var(--mango-d) 70%,transparent);transition:transform .15s ease,box-shadow .15s ease,filter .15s ease}
.btn:hover{filter:brightness(1.06);transform:translateY(-2px);box-shadow:0 10px 20px -8px color-mix(in srgb,var(--mango-d) 75%,transparent)}
.btn:active{transform:translateY(0) scale(.97);box-shadow:0 3px 8px -4px color-mix(in srgb,var(--mango-d) 70%,transparent)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--ink2);box-shadow:0 3px 10px -6px rgba(16,39,43,.25)}
.btn.sec:hover{background:var(--surface2);border-color:var(--rio)}
.linkbtn{background:none;border:0;color:var(--rio-t);text-decoration:underline;font:inherit;min-height:44px;padding:0 8px;cursor:pointer}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0 4px}

/* Inicio */
.hero{display:grid;gap:28px}
@media(min-width:900px){.hero{grid-template-columns:1.05fr .95fr;align-items:start}}
.wave{display:block;width:min(360px,80%);height:24px;margin:6px 0 14px;color:var(--water)}
.wave path{fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round;stroke-dasharray:14 10;animation:flowmove 2.4s linear infinite}
.subtitle{font-family:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;font-weight:600;font-size:1.3rem;color:var(--rio-t);margin-bottom:12px}
.form{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.field{display:block;margin:0 0 14px}
.field span{display:block;font-weight:700;margin-bottom:4px}
.field input,.field textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:48px}
.field textarea{min-height:88px;resize:vertical}
.two{display:grid;gap:0 14px}
@media(min-width:520px){.two{grid-template-columns:1fr 1fr}}
.agree{display:flex;gap:12px;align-items:flex-start;margin:10px 0;cursor:pointer}
.agree input{width:24px;height:24px;margin-top:2px;accent-color:var(--rio);flex:none}
.msg{margin-top:14px}
details{border-top:1px solid var(--line);padding:10px 0}
details summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";margin-left:auto;font-size:1.5rem;color:var(--rio-t)}
details[open] summary::after{content:"\2013"}
details p,details li{max-width:66ch}
.resume{background:var(--warn-bg);border-left:6px solid var(--mango);border-radius:0 14px 14px 0;padding:14px 16px;margin-bottom:18px}

/* Mapa */
.gm{display:grid;gap:22px;grid-template-areas:"next" "map" "extras"}
.gm .next{grid-area:next}.gm .mapcol{grid-area:map}.gm .extras{grid-area:extras}
@media(min-width:900px){.gm{grid-template-columns:minmax(330px,450px) 1fr;grid-template-areas:"map next" "map extras";align-items:start}}
.mapsvg{display:block;width:100%;height:auto;max-width:460px;margin:0 auto}
.mapbg{fill:var(--map)}
.hill{fill:var(--hill)}
.cactus rect{fill:var(--cactus)}.ceiba .canopy{fill:var(--ceiba)}.ceiba .trunk{fill:var(--trunk)}
.pipe{fill:none;stroke-linecap:round}
.pipe.dry{stroke:var(--dry);stroke-width:5;stroke-dasharray:1 12}
.pipe.bed{stroke:var(--bed);stroke-width:17}
.pipe.wet{stroke:var(--water);stroke-width:9}
.pipe.spark{stroke:rgba(255,255,255,.8);stroke-width:3;stroke-dasharray:6 18;animation:flowmove 1.6s linear infinite}
.pipe.new{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s ease-out .3s forwards}
@keyframes flowmove{to{stroke-dashoffset:-48}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{50%{opacity:.3}}
.node{cursor:pointer;transition:transform .18s ease;transform-box:fill-box;transform-origin:center}
.node:hover,.node:focus-visible{transform:scale(1.07)}
.node:active{transform:scale(.98)}
.node .halo{fill:var(--halo);opacity:0}
.node.open .halo{opacity:1;animation:pulse 2.4s ease-in-out infinite}
.node:focus-visible{outline:none}
.node:focus-visible .halo{opacity:1;stroke:var(--focus);stroke-width:3}
.node .wall{fill:var(--wc)}.node .roof{fill:var(--rc)}.node .door{fill:#4A3222;opacity:.55}.node .stilt{fill:var(--trunk)}
.node.locked .wall{fill:var(--lw)}.node.locked .roof{fill:var(--lr)}
.n-r1{--wc:#E9D8AC;--rc:#B5622E}.n-r2{--wc:#E3D19E;--rc:#8A5A2E}.n-r3{--wc:#EEE1BC;--rc:#6B7D46}
.n-r4{--wc:#E1CF9C;--rc:#8C8C8C}.n-dilema{--wc:#E7D6A6;--rc:#5B3FA0}.n-final{--wc:#F7EFD6;--rc:#D4A332}
.node .flag{fill:var(--aji)}
.bub circle{fill:var(--ink)}.bub text{fill:var(--surface);font:800 14px "Bricolage Grotesque",system-ui,sans-serif;text-anchor:middle}
.node.done .bub circle{fill:var(--ok)}.node.done .bub use{color:var(--on-ok)}.node.locked .bub use{color:#fff}
.node.locked .bub circle{fill:var(--lr)}
.nl,.ns{text-anchor:middle;paint-order:stroke;stroke:var(--map);stroke-width:5px;stroke-linejoin:round;fill:var(--ink)}
.nl{font:700 15px "Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif}
.ns{font:400 12.5px "Atkinson Hyperlegible","Trebuchet MS",system-ui,sans-serif;fill:var(--ink2)}
.tank .tk{fill:#8AA8AD}.tank .tk2{fill:#A6C0C4}.tank use{color:var(--water)}

.panel{background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:20px;box-shadow:var(--shadow)}
.lvl{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.25rem;color:var(--rio-t)}
.roles{list-style:none;margin:10px 0 16px;padding:0;display:grid;gap:8px}
@media(min-width:520px){.roles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}
.role{border:2px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--surface2);display:flex;flex-direction:column}
.role .rn{font-size:.85rem;color:var(--ink2)}
.role strong{font-size:1.05rem}
.role.dev{border-color:var(--mango);background:var(--warn-bg)}
.role small{color:var(--warn);font-weight:700}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;margin:8px 0}
.bslot{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:.8rem;line-height:1.2}
.badge .b-out{fill:var(--surface);stroke:var(--bc);stroke-width:4}
.badge .b-in{fill:var(--bc)}
.badge .b-ic{color:var(--bi,#fff)}
.badge.locked{filter:grayscale(1);opacity:.38}
.b-explorador{--bc:var(--mango);--bi:#231700}.b-detective{--bc:var(--aji)}.b-estratega{--bc:var(--hoja)}
.b-programador{--bc:var(--rio)}.b-pensador{--bc:var(--uva)}.b-ciudadano{--bc:var(--azul)}

/* Retos */
.sheet{background:var(--surface);border:2px solid var(--line);border-top:6px solid var(--accent,var(--rio));border-radius:22px;padding:clamp(16px,3.2vw,34px);box-shadow:var(--shadow);max-width:880px;margin:0 auto}
.sheet-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:-6px 0 6px}
.timer{display:flex;align-items:center;gap:6px;color:var(--ink2);font-variant-numeric:tabular-nums}
.guide{display:flex;gap:14px;align-items:flex-start;background:var(--surface2);border-left:6px solid var(--mango);border-radius:0 16px 16px 0;padding:14px 16px;margin:16px 0}
.guide p{margin:.2em 0 0;max-width:64ch}
.gsub{font-weight:700;margin:.7em 0 .2em;color:var(--rio-t)}
.gsteps{margin:.2em 0 0;padding-left:1.25em;max-width:64ch}
.gsteps li{margin:.28em 0}
.heroscene{display:block;width:100%;height:auto;max-width:440px;margin:8px 0 14px;border-radius:20px;box-shadow:var(--shadow)}
.bigq{display:flex;gap:12px;align-items:center;border:2px dashed var(--water);border-radius:16px;padding:12px 16px;margin:14px 0}
.bigq .ic{color:var(--water);width:1.8rem;height:1.8rem}
.bigq p{margin:0}
.cardlist{list-style:none;margin:0;padding:0}
.qcard{padding:14px 0;border-top:1px solid var(--line)}
.qcard p{margin:0 0 8px;max-width:62ch}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.node.open .wall,.node.open .roof{filter:drop-shadow(0 3px 6px rgba(0,0,0,.18))}
.segbtn{font:inherit;font-weight:700;flex:1 1 96px;min-height:46px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);cursor:pointer;transition:transform .12s ease,background .15s ease}
.segbtn:hover{transform:translateY(-1px);border-color:var(--rio-t)}
.segbtn.on{background:var(--rio);border-color:var(--rio);color:#fff}
.scroll{overflow-x:auto;max-width:100%;margin:8px 0}
.dt{border-collapse:separate;border-spacing:4px;font-variant-numeric:tabular-nums;min-width:100%}
.dt caption{text-align:left;font-weight:700;padding:4px 0 6px}
.dt th{font-weight:700;text-align:left;padding:4px 8px;white-space:nowrap}
.dt thead th{text-align:center}
.dt td{text-align:center}
.dt .meta td,.dt .meta th{color:var(--ink2);font-size:.92rem}
.dt.plain td,.dt.plain th{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left}
.cell{font:inherit;min-width:52px;min-height:48px;border:2px solid var(--line);border-radius:10px;background:var(--surface2);color:var(--ink);cursor:pointer;transition:transform .12s ease}
.cell:hover{transform:scale(1.06);border-color:var(--rio-t)}
.cell.on{background:var(--aji);border-color:var(--aji);color:#fff;font-weight:700}
.part{border-top:1px solid var(--line);padding-top:16px;margin-top:20px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:2px solid var(--line);border-radius:14px;margin:8px 0;cursor:pointer;background:var(--surface);transition:transform .12s ease,border-color .15s ease,box-shadow .15s ease}
.opt:hover{transform:translateY(-1px);box-shadow:0 6px 14px -10px rgba(16,39,43,.4)}
.opt:has(input:checked){border-color:var(--rio);background:var(--surface2)}
.opt input{width:22px;height:22px;margin-top:2px;accent-color:var(--rio);flex:none}
.picks{display:grid;gap:8px;margin:8px 0}
@media(min-width:640px){.picks{grid-template-columns:1fr 1fr}}
.pick{font:inherit;text-align:left;min-height:52px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:center;transition:transform .12s ease,box-shadow .15s ease}
.pick:hover{transform:translateY(-1px);box-shadow:0 6px 14px -10px rgba(16,39,43,.4)}
.pick .box{width:22px;height:22px;border:2px solid var(--ink2);border-radius:6px;flex:none;display:grid;place-items:center}
.pick[aria-checked="true"]{border-color:var(--rio);background:var(--rio);color:#fff}
.pick[aria-checked="true"] .box{background:#fff;border-color:#fff;color:var(--rio)}
.count{font-weight:700;color:var(--rio-t)}

.algo{display:grid;gap:18px;margin:14px 0}
@media(min-width:760px){.algo{grid-template-columns:1fr 1.15fr}}
.blocks{display:grid;gap:8px;align-content:start}
.blk{font:inherit;text-align:left;min-height:48px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--ink);cursor:pointer}
.blk.code,.pcode{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.9rem}
.pcode{list-style:none;margin:0;padding:0;border:2px solid var(--ink2);border-radius:14px;background:var(--surface2);min-height:120px}
.pl{display:flex;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px dashed var(--line)}
.pl:last-child{border-bottom:0}
.pl .ln{color:var(--ink2);width:1.6em;text-align:right;flex:none}
.pl .tx{flex:1;overflow-wrap:anywhere;padding-left:calc(var(--ind,0) * 18px)}
.pl button{min-width:40px;min-height:40px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}
.empty{padding:16px;color:var(--ink2);font-family:"Atkinson Hyperlegible",system-ui,sans-serif}

.flow{display:flex;flex-direction:column;align-items:center;margin:12px auto;max-width:440px}
.fn{padding:10px 14px;border:2px solid var(--rio);background:var(--surface2);border-radius:10px;text-align:center;width:min(100%,330px);font-size:.95rem}
.fn.start,.fn.end{border-radius:999px;background:var(--rio);color:#fff;font-weight:700}
.fn.dec{background:var(--mango);color:var(--btn-text);border-color:var(--mango);border-radius:6px 26px 6px 26px}
.fa{width:2px;height:18px;background:var(--rio);position:relative;flex:none}
.fa::after{content:"";position:absolute;bottom:-2px;left:-5px;border:6px solid transparent;border-top-color:var(--rio);border-bottom:0}
.floop{border:2px dashed var(--rio);border-radius:18px;padding:10px 12px 12px;display:flex;flex-direction:column;align-items:center;width:100%}
.floop-t{font-weight:700;color:var(--rio-t);margin-bottom:8px}
.floop-b{font-size:.85rem;color:var(--ink2);margin-top:8px}

.fbx{border-left:6px solid;border-radius:0 14px 14px 0;padding:12px 16px;margin-top:16px;animation:fbxPop .32s cubic-bezier(.2,.8,.2,1.2) both}
@keyframes fbxPop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.fbx.ok .fbx-ic{animation:okPop .5s cubic-bezier(.3,1.6,.4,1) both}
@keyframes okPop{0%{transform:scale(.3) rotate(-10deg)}70%{transform:scale(1.15) rotate(4deg)}100%{transform:scale(1) rotate(0)}}
.fbx ul{margin:.4em 0 0;padding-left:1.2em}
.fbx li{margin:.3em 0;max-width:64ch}
.fbx-head{display:flex;align-items:center;gap:10px}
.fbx-ic{width:1.6em;height:1.6em;flex:none;border-radius:50%;padding:4px}
.fbx.ok{background:var(--ok-bg);border-color:var(--ok)}
.fbx.ok .fbx-ic{color:var(--ok);background:var(--surface)}
.fbx.no{background:var(--no-bg);border-color:var(--no)}
.fbx.no .fbx-ic{color:var(--no);background:var(--surface)}
.fbx.warn{background:var(--warn-bg);border-color:var(--mango)}
.fbx.warn .fbx-ic{color:var(--warn);background:var(--surface)}
.hintbox{margin-top:16px;border:2px dashed var(--mango);border-radius:14px;padding:12px 16px;background:var(--surface2)}
.hintbox ol{margin:.4em 0;padding-left:1.3em}
.donebox{margin-top:22px;border-top:2px solid var(--line);padding-top:18px}
.badgeRow{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin:8px 0 12px}
.badgeRow span{font-weight:700}
.note.warn{background:var(--warn-bg);border-left:6px solid var(--mango);padding:10px 14px;border-radius:0 12px 12px 0}

/* Bitácora */
.doc{background:var(--surface);border:2px solid var(--ink2);border-left:10px double var(--mango-d);border-radius:8px 22px 22px 8px;padding:clamp(16px,3vw,32px);margin:20px 0;box-shadow:var(--shadow)}
.letterhead{display:flex;align-items:center;gap:14px;padding-bottom:14px;margin-bottom:14px;border-bottom:2px solid var(--line)}
.letterhead img{width:56px;height:56px;border-radius:50%;flex:none}
.letterhead strong{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.1rem;color:var(--rio-t)}
.letterhead span{color:var(--ink2);font-size:.92rem}
.doc h2{border-bottom:2px solid var(--line);padding-bottom:6px;margin-top:1.2em}
.doc h2:first-child{margin-top:0}
.doc ul{margin:.3em 0 .8em;padding-left:1.2em}
.doc pre{margin:.4em 0;padding:10px 12px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;overflow-x:auto;font-size:.88rem;line-height:1.5}
.board td,.board th{padding:6px 12px;text-align:center;border-bottom:1px solid var(--line)}
.board th:first-child,.board td:first-child{text-align:left}

/* Componentes flotantes */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translate(-50%,30px);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:14px;max-width:min(92vw,480px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
#toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(6,20,23,.66);display:grid;place-items:center;padding:16px;z-index:80}
.mbox{background:var(--surface);color:var(--ink);border-radius:24px;padding:26px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.mbox .badge{animation:pop .5s ease-out}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;opacity:.9;animation:confettiFall 1.6s ease-in forwards}
@keyframes confettiFall{to{transform:translateY(340px) rotate(340deg);opacity:0}}
@keyframes pop{from{transform:scale(.6) rotate(-12deg);opacity:0}}
.progress{height:14px;border-radius:999px;background:var(--surface2);border:2px solid var(--line);overflow:hidden;margin:8px 0 2px}
.progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--mango),var(--hoja));transition:width .5s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion: reduce){
  .pipe.spark,.node.open .halo,.wave path,.mbox .badge,.confetti i,.fbx,.fbx-ic,.wrap{animation:none}
  .pipe.new{animation:none;stroke-dashoffset:0}
  #toast{transition:none}
}
@media print{
  .top,.noprint,#toast,.modal{display:none!important}
  body{background:#fff;color:#000}
  :root{padding:0}
  .doc{box-shadow:none;border:1px solid #777;border-left:6px double #777;background:#fff}
  .wrap{padding:0}
}
</style>

    if (b.id === 10) { if (inLoop) { h += '<div class="floop-b">Se repite con el siguiente sector</div></div>'; inLoop = false; } h += '<div class="fa"></div><div class="fn end">FIN</div>'; return; }
    if (b.id === 5) { h += '<div class="fa"></div><div class="floop"><div class="floop-t">' + b.flow + '</div>'; inLoop = true; first = true; return; }
    if (!first) h += '<div class="fa"></div>';
    first = false;
    h += '<div class="fn ' + (b.id === 9 ? 'dec' : 'proc') + '">' + (b.flow || b.t) + '</div>';
  });
  return h + '</div>';
}

    (avail.length ? avail.map(b => '<button type="button" class="blk code" data-act="add" data-id="' + b.id + '">' + esc(b.t) + '</button>').join('') : '<p class="small">Ya usaron todos los bloques.</p>') + '</div></div>' +
    '<div><h2>Su algoritmo</h2><ol class="pcode" aria-label="Algoritmo en pseudocódigo">' +
    (placed.length ? placed.map((b, i) => '<li class="pl" style="--ind:' + b.ind + '"><span class="ln">' + (i + 1) + '</span><span class="tx">' + esc(b.t) + '</span>' +
      (solved ? '' : '<button type="button" data-act="up" data-i="' + i + '" aria-label="Subir bloque ' + (i + 1) + '">▲</button><button type="button" data-act="down" data-i="' + i + '" aria-label="Bajar bloque ' + (i + 1) + '">▼</button><button type="button" data-act="rm" data-i="' + i + '" aria-label="Quitar bloque ' + (i + 1) + '">✕</button>') + '</li>').join('') : '<li class="empty">Toquen un bloque para agregarlo aquí. Empiecen por el que abre el algoritmo.</li>') +
    '</ol></div></div>' + (solved ? '' : actionsHTML('r4')));
}
function r4Check(){
  const w = work('r4'), list = w.list.map(id => R4.blocks.find(b => b.id === id));
  if (!list.length) return fb('warn', 'Todavía no hay bloques', ['Agreguen bloques para armar el algoritmo.']);
  S.attempts.r4++;
  const items = [];
  list.filter(b => !b.ok).forEach(b => items.push('Sobra «' + b.t + '»: ' + b.why));
  const missing = R4.blocks.filter(b => b.ok && !list.includes(b));
  if (missing.length) items.push('Faltan ' + missing.length + ' bloque(s). Piensen qué paso hace falta para que el algoritmo funcione de principio a fin.');
  const good = list.filter(b => b.ok);
  for (let i = 1; i < good.length; i++) if (good[i].rank < good[i - 1].rank) { items.push('El bloque «' + good[i].t + '» está fuera de lugar. ' + good[i].ord); break; }
  if (!items.length) return finish('r4', {lines:list.map(b => '  '.repeat(b.ind) + b.t)});
  save(); fb('no', 'El algoritmo todavía no funciona', items, 'Pueden mover, quitar o agregar bloques y revisar de nuevo. Equivocarse aquí no baja la insignia.');
}

/* Dilema */

  const locked = !!S.done.dilema;
  return shell('dilema',
    guide('Falta poco para entregar el algoritmo y van atrasados. Ahora es el turno del equipo Yarumo, pero el dispositivo está sobre su mesa y nadie está mirando. Podrían usarlo sin avisar y terminar antes. ¿Qué hacen?', [
      'Lean las cuatro opciones y elijan una con el botón redondo.',

      'Si la consecuencia no fue buena, pueden elegir otra opción y volver a decidir.',
      'Cuando la decisión sea buena, escriban en pocas frases por qué la tomaron y guárdenla para la Bitácora.'
    ]) +
    '<fieldset style="border:0;padding:0;margin:0"><legend class="sr">Elijan qué hará el equipo</legend>' +
    DIL.opts.map(o => '<label class="opt"><input type="radio" name="dil" value="' + o.id + '" data-group="dil"' + (sel === o.id ? ' checked' : '') + (locked ? ' disabled' : '') + '><span>' + o.t + '</span></label>').join('') + '</fieldset>' +

    (c && c.res !== 'no' && !locked ? '<div class="part"><label class="field"><span>¿Por qué tomaron esta decisión? Escríbanlo para la Bitácora.</span><textarea data-field="dilwhy" maxlength="400">' + esc(w.why) + '</textarea></label><div class="actions"><button type="button" class="btn" data-act="savedil">Guardar decisión</button></div></div>' : '') +
    '<div id="fb" aria-live="polite">' + (w.fb || '') + '</div>');
}

/* Logro final */
function bitacora(){
  const t = S.team, L = S.log, lines = [];
  const stage = ['Misión 1','Misión 2','Misión 3','Misión 4','Dilema'];
  lines.push('BITÁCORA DE LA MISIÓN','Aldea Tecnológica: Misión Pensamiento Computacional','Equipo: ' + t.name,'Integrantes: ' + t.members.join(', '),'Fecha: ' + new Date().toLocaleDateString('es-CO'),'');
  lines.push('Acuerdos de la aldea aceptados: ' + AGREE.length + ' de ' + AGREE.length,'');
  lines.push('MISIÓN 1. DESCOMPOSICIÓN (Explorador)');
  if (L.r1) R1.cols.forEach(c => { lines.push('- ' + c.name + ':'); L.r1.groups[c.id].forEach(x => lines.push('    * ' + x)); });
  lines.push('','MISIÓN 2. PATRONES (Detective de Patrones)');
  if (L.r2) lines.push('- Patrón del agua: ' + L.r2.rule,'- Patrón del dispositivo: ' + L.r2.device);
  lines.push('','MISIÓN 3. ABSTRACCIÓN (Estratega)');
  if (L.r3) { lines.push('- Datos esenciales:'); L.r3.data.forEach(x => lines.push('    * ' + x)); lines.push('- Reglas de uso del dispositivo:'); L.r3.rules.forEach(x => lines.push('    * ' + x)); }
  lines.push('','MISIÓN 4. ALGORITMO INTEGRADOR (Programador en Formación)');
  if (L.r4) L.r4.lines.forEach(x => lines.push('    ' + x));
  lines.push('','DILEMA DEL RECURSO COMPARTIDO');
  if (L.dilema) {
    lines.push('- Primera decisión: ' + L.dilema.first,'- Decisión final: ' + L.dilema.final);
    lines.push('- Reconsideraron su decisión: ' + (L.dilema.first !== L.dilema.final ? 'sí' : 'no'),'- Por qué: ' + L.dilema.why);
  }
  lines.push('','ROLES POR MISIÓN');
  stage.forEach((s, i) => lines.push('- ' + s + ': ' + rolesAt(i).map(r => r.role + ' ' + r.name).join(', ')));
  lines.push('','REGISTRO DE APOYOS (informativo, no cambia las insignias)');
  ['r1','r2','r3','r4'].forEach((k, i) => lines.push('- Misión ' + (i + 1) + ': ' + S.attempts[k] + ' intento(s), ' + S.hints[k] + ' pista(s) pedida(s)'));
  lines.push('','INSIGNIAS OBTENIDAS: ' + S.badges.map(b => BADGES[b].name).join(', '),'');
  lines.push('REFLEXIÓN DEL EQUIPO','- Lo que aprendimos: ' + (S.reflection.aprendi || '(sin completar)'),'- Lo que mejoraríamos: ' + (S.reflection.mejorar || '(sin completar)'));
  return lines.join('\n');
}

    '<label class="field noprint"><span>¿Qué aprendimos sobre pensamiento computacional y uso responsable?</span><textarea data-field="ref1" maxlength="500">' + esc(S.reflection.aprendi) + '</textarea></label>' +
    '<label class="field noprint"><span>¿Qué mejoraríamos la próxima vez?</span><textarea data-field="ref2" maxlength="500">' + esc(S.reflection.mejorar) + '</textarea></label></div>';
  const board = '<table class="dt plain board"><caption>Tablero de misiones del equipo</caption><thead><tr><th scope="col">Equipo</th><th scope="col">Misión 1</th><th scope="col">Misión 2</th><th scope="col">Misión 3</th><th scope="col">Misión 4</th><th scope="col">Dilema</th></tr></thead><tbody><tr><td>' + esc(t.name) + '</td>' +
    ['r1','r2','r3','r4','dilema'].map(k => '<td>' + (S.done[k] ? '<svg class="ic" role="img" aria-label="Completada"><use href="#i-check"/></svg>' : '—') + '</td>').join('') + '</tr></tbody></table>';
  return '<div class="wrap"><button type="button" class="linkbtn noprint" data-act="map">Volver al mapa</button>' +
    '<h1 id="ttl" tabindex="-1">Logro final: la aldea los espera</h1>' +
    '<p class="lead noprint">Terminaron las cuatro misiones y el dilema. Ahora presenten su solución a la comunidad educativa y entreguen la Bitácora a la guía.</p>' +
    '<section class="panel noprint" style="margin:18px 0"><h2>Sus insignias</h2>' + shelfHTML() + '<p class="small">La insignia «Pensador Computacional» reconoce el dominio del pensamiento computacional (RA1). «Ciudadano Digital Responsable» reconoce el uso cuidadoso y ético del dispositivo compartido (RA2).</p></section>' +
    doc +
    '<section class="panel noprint"><h2>Entrega y presentación</h2><div class="actions" style="margin-top:0"><button type="button" class="btn" data-act="copy">Copiar la Bitácora</button><button type="button" class="btn sec" data-act="print">Imprimir o guardar en PDF</button></div>' +
    '<div id="copyarea"></div>' +
    '<h3 style="margin-top:18px">Orden sugerido para presentar (un minuto por persona)</h3><ol><li>El líder presenta el problema de la aldea y las tres partes en que lo dividieron.</li><li>El registrador muestra el patrón encontrado y los datos esenciales.</li><li>El verificador explica el algoritmo con el pseudocódigo o el diagrama.</li><li>' + (t.members.length > 3 ? 'El relevo y todo el equipo' : 'Todo el equipo') + ' cuenta la decisión del dilema y lo que aprendieron.</li></ol>' +
    '<div class="scroll" style="margin-top:18px">' + board + '</div><p class="small">En el aula, la guía actualiza además la cartelera física con las misiones completadas por cada equipo.</p></section></div>';
}

/* ---------- Render ---------- */
function render(){
  const v = {start:startView, map:mapView, r1:r1View, r2:r2View, r3:r3View, r4:r4View, dilema:dilemaView, final:finalView}[S.screen];
  $('#main').innerHTML = v();
  renderRiver(); paintTimer();
  if (S.screen === 'map' && S.justDone) { const j = S.justDone; setTimeout(() => { if (S.justDone === j) { S.justDone = null; save(); } }, 2500); }
}
function renderRiver(){
  const el = $('#river');
  if (S.screen === 'start') { el.hidden = true; return; }
  el.hidden = false;
  const ids = ['r1','r2','r3','r4','dilema'], n = ids.filter(k => S.done[k]).length;
  el.setAttribute('role', 'img'); el.setAttribute('aria-label', 'Misiones completadas: ' + n + ' de 5');
  el.innerHTML = ids.map(k => '<span class="stone' + (S.done[k] ? ' on' : '') + '"></span>').join('') + '<span aria-hidden="true">&nbsp;' + n + '/5</span>';
}
function selectorFor(el){
  const d = el.dataset; if (!d.act) return null;
  let s = '[data-act="' + d.act + '"]'; ['card','col','k','id','i','g'].forEach(k => { if (d[k] !== undefined) s += '[data-' + k + '="' + d[k] + '"]'; });
  return s;
}
function rerender(focusSel){
  const y = window.scrollY, a = document.activeElement;
  const sel = focusSel || (a && a.dataset ? selectorFor(a) : null);
  render(); window.scrollTo(0, y);
  if (sel) { const el = $(sel); if (el) el.focus({preventScroll:true}); }
}
function go(scr){
  S.screen = scr; save(); stopTimer(); render(); window.scrollTo(0, 0);
  if (['r1','r2','r3','r4'].includes(scr) && !S.done[scr]) startTimer();
  const h = $('#ttl'); if (h) h.focus({preventScroll:true});
}
function fb(kind, title, items, extra){
  const icon = kind === 'ok' ? 'check' : kind === 'no' ? 'x' : 'alert';
  work(S.screen).fb = '<div class="fbx ' + kind + '"><div class="fbx-head"><svg class="ic fbx-ic"><use href="#i-' + icon + '"/></svg><strong>' + title + '</strong></div>' + (items && items.length ? '<ul>' + items.map(i => '<li>' + i + '</li>').join('') + '</ul>' : '') + (extra ? '<p>' + extra + '</p>' : '') + '</div>';
  rerender('[data-act="check"]');
  const el = $('#fb'); if (el) el.scrollIntoView({block:'nearest'});
}
function finish(id, log){
  S.done[id] = true; S.log[id] = log || S.log[id]; S.justDone = id; work(id).fb = '';
  AWARDS[id].forEach(b => { if (!S.badges.includes(b)) S.badges.push(b); });
  save(); stopTimer(); rerender('#dn');
  showBadges(AWARDS[id].slice());
}
function confettiHTML(){
  const cols = ['--mango','--aji','--hoja','--uva','--azul','--rio'];
  let s = '<div class="confetti" aria-hidden="true">';
  for (let i = 0; i < 22; i++) {
    const left = Math.round(Math.random() * 100), delay = (Math.random() * .35).toFixed(2), col = cols[i % cols.length];
    s += '<i style="left:' + left + '%;background:var(' + col + ');animation-delay:' + delay + 's"></i>';
  }
  return s + '</div>';
}
function showBadges(queue){
  const id = queue.shift();
  if (!id) { const h = $('#dn'); if (h) { h.focus(); h.scrollIntoView({block:'start'}); } return; }
  const b = BADGES[id], wrap = document.createElement('div');
  wrap.className = 'modal';
  wrap.innerHTML = '<div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mt">' + confettiHTML() + '<h2 id="mt">¡' + PRAISE[Math.floor(Math.random() * PRAISE.length)] + '! Ganaron la insignia «' + esc(b.name) + '»</h2>' + badgeSVG(id, false, 132) + '<p>' + b.desc + '</p><button type="button" class="btn">Seguir</button></div>';
  document.body.appendChild(wrap);
  const btn = wrap.querySelector('button'); btn.focus();
  btn.addEventListener('click', () => { wrap.remove(); showBadges(queue); });
  wrap.addEventListener('keydown', e => { if (e.key === 'Escape') btn.click(); });
}
let tt; function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 3800); }

/* Temporizador */
let tInt = null, tLeft = 1200, tRun = false;
function paintTimer(){
  const el = $('#timer'); if (!el) return;
  el.textContent = String(Math.floor(tLeft / 60)).padStart(2, '0') + ':' + String(tLeft % 60).padStart(2, '0');
  const b = $('#tpause'); if (b) b.textContent = tRun ? 'Pausar' : (tLeft === 0 ? 'Tiempo cumplido' : 'Reanudar');
  const n = $('#timerNote'); if (n) n.hidden = tLeft !== 0;
}
function startTimer(){ stopTimer(); tLeft = 1200; tRun = true; paintTimer(); tInt = setInterval(() => { if (!tRun) return; tLeft = Math.max(0, tLeft - 1); if (tLeft === 0) tRun = false; paintTimer(); }, 1000); }
function stopTimer(){ if (tInt) { clearInterval(tInt); tInt = null; } tRun = false; }

/* ---------- Acciones ---------- */
const ACTIONS = {
  theme(){ const r = document.documentElement; const cur = r.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); r.dataset.theme = cur === 'dark' ? 'light' : 'dark'; },
  cont(){ S = SAVED; SAVED = null; go('map'); },
  restart(){ clearSave(); SAVED = null; S = fresh(); Object.keys(WK).forEach(k => delete WK[k]); go('start'); },
  enter(){
    const name = S.team.name.trim(), m = S.team.members.map(x => x.trim()).filter(Boolean), errs = [];
    if (name.length < 2) errs.push('Escriban el nombre del equipo.');
    if (m.length < 3) errs.push('Escriban los nombres de al menos 3 integrantes.');
    if (new Set(m.map(x => x.toLowerCase())).size !== m.length) errs.push('Los nombres de los integrantes no pueden repetirse.');
    if (!work('start').agree.every(Boolean)) errs.push('Acepten los tres acuerdos de la aldea.');
    if (errs.length) { $('#startMsg').innerHTML = '<div class="fbx warn"><strong>Falta completar:</strong><ul>' + errs.map(e => '<li>' + e + '</li>').join('') + '</ul></div>'; return; }
    S.team.name = name; S.team.members = m; S.agreed = true; go('map');
  },
  map(){ go('map'); },
  go(el){ const id = el.dataset.id; if (id === 'final') { S.finalSeen = true; save(); } go(id); },
  node(el){
    const id = el.dataset.id, st = nodeState(id);
    if (st === 'locked') return toast(id === 'final' ? 'La casa comunal se abre cuando resuelvan el dilema.' : 'Esta misión está bloqueada. Completen primero la misión anterior.');
    if (st === 'done' && id !== 'final') return toast('Misión completada. Insignia obtenida: ' + BADGES[STAGES.find(s => s.id === id).badge].name + '.');
    if (id === 'final') { S.finalSeen = true; save(); }
    go(id);
  },
  tpause(){ if (tLeft === 0) return; tRun = !tRun; paintTimer(); },
  assign(el){ work('r1').assign[el.dataset.card] = el.dataset.col; work('r1').fb = ''; rerender(); },
  cell(el){ const s = work('r2').cells, k = el.dataset.k; s.has(k) ? s.delete(k) : s.add(k); rerender(); },
  pick(el){ const w = work('r3'), s = el.dataset.g === 'a' ? w.a : w.b, id = el.dataset.id; s.has(id) ? s.delete(id) : s.add(id); rerender(); },
  add(el){ work('r4').list.push(+el.dataset.id); rerender('[data-act="add"]'); },
  up(el){ const l = work('r4').list, i = +el.dataset.i; if (i > 0) { [l[i - 1], l[i]] = [l[i], l[i - 1]]; rerender('[data-act="up"][data-i="' + (i - 1) + '"]'); } },
  down(el){ const l = work('r4').list, i = +el.dataset.i; if (i < l.length - 1) { [l[i + 1], l[i]] = [l[i], l[i + 1]]; rerender('[data-act="down"][data-i="' + (i + 1) + '"]'); } },
  rm(el){ work('r4').list.splice(+el.dataset.i, 1); rerender('[data-act="rm"]'); },
  hint(){ const id = S.screen; if (S.hints[id] < HINTS[id].length) S.hints[id]++; save(); rerender('[data-act="hint"]'); const h = $('#hintbox'); if (h) h.scrollIntoView({block:'nearest'}); },
  check(){ ({r1:r1Check, r2:r2Check, r3:r3Check, r4:r4Check})[S.screen](); },
  decide(){
    const w = work('dilema'); if (!w.pick) { w.fb = '<div class="fbx warn"><strong>Elijan una opción antes de decidir.</strong></div>'; return rerender(); }
    w.fb = ''; if (w.first === null) w.first = w.pick; S.attempts.dilema++; w.confirmed = w.pick; save(); rerender('[data-act="decide"]');
  },
  savedil(){
    const w = work('dilema');
    if (w.why.trim().length < 15) { w.fb = '<div class="fbx warn"><strong>Escriban al menos una frase que explique la decisión.</strong></div>'; return rerender(); }
    finish('dilema', {first:w.first, final:w.confirmed, why:w.why.trim()});
  },
  copy(){
    const txt = bitacora();
    const fallback = () => { $('#copyarea').innerHTML = '<label class="field" style="margin-top:14px"><span>Seleccionen y copien este texto</span><textarea id="ctext" readonly style="min-height:200px"></textarea></label>'; const ta = $('#ctext'); ta.value = txt; ta.focus(); ta.select(); };
    try { navigator.clipboard.writeText(txt).then(() => toast('Bitácora copiada. Pueden pegarla en un documento.'), fallback); } catch (e) { fallback(); }
  },
  print(){ try { window.print(); } catch (e) { toast('No se pudo abrir la impresión. Usen «Copiar la Bitácora».'); } }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; const f = ACTIONS[el.dataset.act]; if (f) f(el, e); });
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('role') === 'button' && e.target.dataset.act) { e.preventDefault(); e.target.click(); } });
document.addEventListener('input', e => {
  const f = e.target.dataset && e.target.dataset.field; if (!f) return;
  const v = e.target.value;
  if (f === 'team') S.team.name = v;
  else if (/^m\d$/.test(f)) S.team.members[+f[1]] = v;
  else if (f === 'ref1') { S.reflection.aprendi = v; save(); }
  else if (f === 'ref2') { S.reflection.mejorar = v; save(); }
  else if (f === 'dilwhy') work('dilema').why = v;
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.agree !== undefined) work('start').agree[+t.dataset.agree] = t.checked;
  else if (t.dataset && t.dataset.group === 'r2b') work('r2').b = t.value;
  else if (t.dataset && t.dataset.group === 'r2c') work('r2').c = t.value;
  else if (t.dataset && t.dataset.group === 'dil') work('dilema').pick = t.value;
});

render();
})();
</script>
</body>
</html>
